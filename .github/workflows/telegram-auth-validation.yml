name: Telegram auth validation

on:
  pull_request:
    paths:
      - "supabase/functions/telegram-auth/**"
      - ".github/workflows/telegram-auth-validation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/telegram-auth/**"
      - ".github/workflows/telegram-auth-validation.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Telegram auth function
        run: deno check supabase/functions/telegram-auth/index.ts supabase/functions/telegram-auth/telegram_init_data_test.ts
      - name: Run Telegram initData validation tests
        run: deno test supabase/functions/telegram-auth/telegram_init_data_test.ts

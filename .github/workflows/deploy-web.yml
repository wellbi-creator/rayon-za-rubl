name: Build and deploy Godot Web game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Export Web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Ensure Godot 4.3 Web export templates are installed
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot-export-templates.tpz
          mkdir -p /tmp/godot-export-templates
          unzip -oq /tmp/godot-export-templates.tpz -d /tmp/godot-export-templates
          cp -f /tmp/godot-export-templates/templates/web_nothreads_debug.zip "$TEMPLATE_DIR/"
          cp -f /tmp/godot-export-templates/templates/web_nothreads_release.zip "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          ls -lh "$TEMPLATE_DIR"/web_nothreads_*.zip

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit --verbose

      - name: Diagnose Web export preset
        run: |
          echo "=== Export preset ==="
          cat export_presets.cfg
          echo "=== Installed Web templates ==="
          ls -lah "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "=== Godot editor diagnostics ==="
          godot --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/godot-editor-diagnostics.log

      - name: Smoke-test the main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 --verbose 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Cannot open file" /tmp/godot-main-scene.log; then
            echo "Main scene startup reported a script or resource error."
            exit 1
          fi

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/godot-web-export.log
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          echo "=== Exported Web payload sizes ==="
          ls -lh build/web/index.html build/web/index.js build/web/index.wasm build/web/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

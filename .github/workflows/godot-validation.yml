name: Godot project validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and launch project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Show Godot version
        run: godot --version

      - name: Import project and parse resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee ci-logs/editor-import.log

      - name: Launch main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 --verbose 2>&1 | tee ci-logs/main-scene.log

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7
